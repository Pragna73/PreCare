name: PreCare Selenium Website Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html

      - name: Run 300 Selenium Website tests
        run: |
          mkdir -p reports
          pytest tests/selenium/ -v -W ignore --html=reports/selenium-report.html --self-contained-html

      - name: Upload Selenium HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: reports/selenium-report.html
