name: Package Complete PreCare Project (ZIP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-project:
    name: Create Complete Downloadable PreCare Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Clean Complete Project ZIP
        run: |
          mkdir -p dist-release
          zip -r dist-release/PreCare-complete-project.zip . \
            -x ".git/*" \
            -x "*/.git/*" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "*/.venv/*" \
            -x "*.venv*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "*/.pytest_cache/*" \
            -x "*.DS_Store" \
            -x "*/.DS_Store" \
            -x "*.db" \
            -x "*.db-journal" \
            -x "*.env" \
            -x "*/.env" \
            -x "DerivedData/*" \
            -x "*/DerivedData/*" \
            -x "dist-release/*"

      - name: Upload Complete PreCare ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PreCare-complete-project
          path: dist-release/PreCare-complete-project.zip
