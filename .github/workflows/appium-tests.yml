name: PreCare Appium Mobile Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Appium and Python testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Appium-Python-Client pytest pytest-html selenium

      - name: Run 305 Appium Mobile tests
        run: |
          mkdir -p reports
          pytest tests/appium/ -v --html=reports/appium-report.html --self-contained-html

      - name: Upload Appium HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-report
          path: reports/appium-report.html
